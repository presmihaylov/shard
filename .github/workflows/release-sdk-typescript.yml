name: release typescript sdk

# Packs useshards under a useshards-ts-v<version> tag on main. The upload to npm waits on the npm
# environment's approval, and npm takes it only from this workflow, so no token lives in the repo.
on:
  push:
    tags: ['useshards-ts-v*']

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A tag on a feature head must publish nothing.
      - name: the tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_SHA is not on main"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json

      - name: the tag names the package version
        working-directory: sdks/typescript
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "useshards-ts-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "the tag is $GITHUB_REF_NAME, but the package says $version"
            exit 1
          fi

      - name: check
        run: make sdk-ts-check

      - name: pack
        working-directory: sdks/typescript
        run: npm pack

      # The tarball must install and import with no dependencies of its own.
      - name: install the tarball into a clean project
        run: |
          mkdir /tmp/clean
          cd /tmp/clean
          npm init -y
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE"/sdks/typescript/useshards-*.tgz
          node --input-type=module -e 'import { version } from "useshards"; console.log(version)'

      - uses: actions/upload-artifact@v4
        with:
          name: useshards-ts-dist
          path: sdks/typescript/useshards-*.tgz

  publish:
    name: publish to npm
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: useshards-ts-dist

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing from a workflow needs npm 11.5.1 or later, which node 22 does not bundle.
      - name: npm
        run: npm install -g npm@11.5.1

      - name: publish
        run: npm publish useshards-*.tgz
