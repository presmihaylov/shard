name: sdk release

# Builds one SDK under its sdk-<language>-v<version> tag on main into a draft GitHub release; nothing goes to npm or PyPI.
on:
  push:
    tags: ['sdk-typescript-v*', 'sdk-python-v*']

permissions:
  contents: read

env:
  UV_VERSION: 0.5.9

jobs:
  # A tag on a feature head must release nothing, so every build waits on this.
  on-main:
    name: the tag is on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: check
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_SHA is not on main"; exit 1; }

  sdk-gate:
    name: sdk release gate
    needs: on-main
    runs-on: ubuntu-latest
    env:
      SHARD_REMOTE: https://127.0.0.1:8443
      SHARD_GATE_HOST_PATHS: /mnt/reflink
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"

      - name: host tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xfsprogs socat nftables
          command -v runc >/dev/null || sudo apt-get install -y -q runc

      - name: build
        run: make build build-shard-init

      # The daemon refuses a root that cannot reflink, and the runner's ext4 cannot.
      - name: daemon, front and tokens
        run: |
          set -o pipefail
          dir="$RUNNER_TEMP/front"
          root=/mnt/reflink/shard
          mkdir -p "$dir"
          truncate -s 8G "$RUNNER_TEMP/reflink.img"
          mkfs.xfs -q -m reflink=1 "$RUNNER_TEMP/reflink.img"
          sudo mkdir -p /mnt/reflink
          sudo mount -o loop "$RUNNER_TEMP/reflink.img" /mnt/reflink

          # One token with every public scope, and a "*" one the gate proves still reaches no local route.
          api=$(sudo bin/shard --root "$root" tokens mint --name gate --scopes 'sandbox:read,sandbox:write,sandbox:delete,exec,secret:*,policy:*' | jq -r .token)
          echo "::add-mask::$api"
          wildcard=$(sudo bin/shard --root "$root" tokens mint --name gate-wildcard --scopes '*' | jq -r .token)
          echo "::add-mask::$wildcard"
          { echo "SHARD_API_KEY=$api"; echo "SHARD_SUITE_WILDCARD_KEY=$wildcard"; } >>"$GITHUB_ENV"

          sudo SHARD_INIT_PATH="$PWD/bin/shard-init" bin/shard --root "$root" daemon --provider runc >"$dir/daemon.log" 2>&1 &
          echo $! >"$dir/daemon.pid"
          timeout 60 sh -c "until grep -q 'api listening on' '$dir/daemon.log' && grep -q 'proxy listening on' '$dir/daemon.log'; do sleep 0.2; done" || { cat "$dir/daemon.log"; exit 1; }

          sudo bin/shard --root "$root" serve --listen 127.0.0.1:2377 >"$dir/serve.log" 2>&1 &
          echo $! >"$dir/serve.pid"
          timeout 30 sh -c "until grep -q 'serve listening on' '$dir/serve.log'; do sleep 0.2; done" || { cat "$dir/serve.log"; exit 1; }

          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -days 1 -subj /CN=127.0.0.1 \
            -addext subjectAltName=IP:127.0.0.1 -keyout "$dir/key.pem" -out "$dir/cert.pem" 2>/dev/null
          socat "OPENSSL-LISTEN:8443,bind=127.0.0.1,reuseaddr,fork,cert=$dir/cert.pem,key=$dir/key.pem,verify=0" TCP:127.0.0.1:2377 &
          echo $! >"$dir/socat.pid"
          echo "SHARD_CA_FILE=$dir/cert.pem" >>"$GITHUB_ENV"
          # The front refuses a request with no token, so any answer at all proves the TLS front is up.
          timeout 30 sh -c 'until curl -sS --cacert "$0" -o /dev/null https://127.0.0.1:8443/v0/version; do sleep 0.2; done' "$dir/cert.pem"

      - name: gate
        run: make sdk-gate SDK_GATE_FLAGS="--out $RUNNER_TEMP/gate"

      - name: daemon and front logs
        if: failure()
        run: cat "$RUNNER_TEMP/front/daemon.log" "$RUNNER_TEMP/front/serve.log"

      # The gate redacts both keys from every log and recorded response it writes.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sdk-gate
          path: ${{ runner.temp }}/gate
          if-no-files-found: ignore

      - name: stop the daemon and the front
        if: always()
        run: |
          for name in socat serve daemon; do
            pid=$(cat "$RUNNER_TEMP/front/$name.pid" 2>/dev/null) || continue
            sudo kill "$pid"
          done

  typescript:
    name: typescript
    needs: [on-main, sdk-gate]
    if: startsWith(github.ref_name, 'sdk-typescript-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json

      - name: the tag names the package version
        working-directory: sdks/typescript
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "sdk-typescript-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "the tag is $GITHUB_REF_NAME, but the package says $version"
            exit 1
          fi

      - name: check
        run: make sdk-ts-check

      - name: pack
        working-directory: sdks/typescript
        run: npm pack

      # A clean project proves the tarball installs and imports with only the dependencies it declares.
      - name: install the tarball into a clean project
        run: |
          mkdir /tmp/clean
          cd /tmp/clean
          npm init -y
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE"/sdks/typescript/useshards-*.tgz
          node --input-type=module -e 'import { version } from "useshards"; console.log(version)'

      - uses: actions/upload-artifact@v4
        with:
          name: sdk
          path: sdks/typescript/useshards-*.tgz

  python:
    name: python
    needs: [on-main, sdk-gate]
    if: startsWith(github.ref_name, 'sdk-python-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: the tag names the package version
        working-directory: sdks/python
        run: |
          version=$(uv run --locked python -c 'import useshards; print(useshards.__version__)')
          if [ "sdk-python-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "the tag is $GITHUB_REF_NAME, but the package says $version"
            exit 1
          fi

      - name: check
        run: make sdk-py-check

      - name: build
        working-directory: sdks/python
        run: uv build

      # The wheel must install and import with only its declared dependencies.
      - name: install the wheel into a clean venv
        working-directory: sdks/python
        run: |
          uv venv /tmp/clean
          uv pip install --python /tmp/clean dist/*.whl
          /tmp/clean/bin/python -c 'import useshards; print(useshards.__version__)'

      - uses: actions/upload-artifact@v4
        with:
          name: sdk
          path: sdks/python/dist/

  # Only this job can write, so no package script ever runs with a token that can.
  release:
    name: draft the release
    needs: [typescript, python]
    if: ${{ !cancelled() && (needs.typescript.result == 'success' || needs.python.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdk
          path: dist

      # Never the latest release: docs/mac.md downloads shard itself from releases/latest.
      - name: draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF_NAME" in
            sdk-typescript-v*) title="useshards (TypeScript) ${GITHUB_REF_NAME#sdk-typescript-v}" ;;
            sdk-python-v*) title="useshards (Python) ${GITHUB_REF_NAME#sdk-python-v}" ;;
          esac
          cd dist
          sha256sum * > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$title" --draft --latest=false --notes "Built by sdk-release.yml from $GITHUB_SHA. Install from these assets: the SDK is on neither npm nor PyPI." *
