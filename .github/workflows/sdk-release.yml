name: sdk release

# Builds, checks and packs the SDKs at one commit into the artifacts sdk-typescript and sdk-python; sdk-publish.yml publishes them.
on:
  workflow_call:
    inputs:
      sdk:
        description: typescript, python or both
        type: string
        required: true
      ref:
        description: the commit to build, the run's own when empty
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      sdk:
        description: the SDK to build
        type: choice
        options: [both, typescript, python]
        default: both
      ref:
        description: the commit to build, the run's own when empty
        type: string
        default: ''

permissions:
  contents: read

env:
  UV_VERSION: 0.5.9
  REF: ${{ inputs.ref || github.sha }}

jobs:
  sdk-gate:
    name: sdk release gate
    runs-on: ubuntu-latest
    env:
      SHARD_REMOTE: https://127.0.0.1:8443
      SHARD_GATE_HOST_PATHS: /mnt/reflink
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"

      - name: host tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xfsprogs socat nftables
          command -v runc >/dev/null || sudo apt-get install -y -q runc

      - name: build
        run: make build build-shard-init

      # The daemon refuses a root that cannot reflink, and the runner's ext4 cannot.
      - name: daemon, front and tokens
        run: |
          set -o pipefail
          dir="$RUNNER_TEMP/front"
          root=/mnt/reflink/shard
          mkdir -p "$dir"
          truncate -s 8G "$RUNNER_TEMP/reflink.img"
          mkfs.xfs -q -m reflink=1 "$RUNNER_TEMP/reflink.img"
          sudo mkdir -p /mnt/reflink
          sudo mount -o loop "$RUNNER_TEMP/reflink.img" /mnt/reflink

          # One token with every public scope, and a "*" one the gate proves still reaches no local route.
          api=$(sudo bin/shard --root "$root" tokens mint --name gate --scopes 'sandbox:read,sandbox:write,sandbox:delete,exec,secret:*,policy:*,port:read,port:write' | jq -r .token)
          echo "::add-mask::$api"
          wildcard=$(sudo bin/shard --root "$root" tokens mint --name gate-wildcard --scopes '*' | jq -r .token)
          echo "::add-mask::$wildcard"
          { echo "SHARD_API_KEY=$api"; echo "SHARD_SUITE_WILDCARD_KEY=$wildcard"; } >>"$GITHUB_ENV"

          sudo SHARD_INIT_PATH="$PWD/bin/shard-init" bin/shard --root "$root" daemon --provider runc >"$dir/daemon.log" 2>&1 &
          echo $! >"$dir/daemon.pid"
          timeout 60 sh -c "until grep -q 'api listening on' '$dir/daemon.log' && grep -q 'proxy listening on' '$dir/daemon.log'; do sleep 0.2; done" || { cat "$dir/daemon.log"; exit 1; }

          sudo bin/shard --root "$root" serve --listen 127.0.0.1:2377 >"$dir/serve.log" 2>&1 &
          echo $! >"$dir/serve.pid"
          timeout 30 sh -c "until grep -q 'serve listening on' '$dir/serve.log'; do sleep 0.2; done" || { cat "$dir/serve.log"; exit 1; }

          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -days 1 -subj /CN=127.0.0.1 \
            -addext subjectAltName=IP:127.0.0.1 -keyout "$dir/key.pem" -out "$dir/cert.pem" 2>/dev/null
          socat "OPENSSL-LISTEN:8443,bind=127.0.0.1,reuseaddr,fork,cert=$dir/cert.pem,key=$dir/key.pem,verify=0" TCP:127.0.0.1:2377 &
          echo $! >"$dir/socat.pid"
          echo "SHARD_CA_FILE=$dir/cert.pem" >>"$GITHUB_ENV"
          # The front refuses a request with no token, so any answer at all proves the TLS front is up.
          timeout 30 sh -c 'until curl -sS --cacert "$0" -o /dev/null https://127.0.0.1:8443/v0/version; do sleep 0.2; done' "$dir/cert.pem"

      - name: gate
        run: make sdk-gate SDK_GATE_FLAGS="--out $RUNNER_TEMP/gate"

      - name: daemon and front logs
        if: failure()
        run: cat "$RUNNER_TEMP/front/daemon.log" "$RUNNER_TEMP/front/serve.log"

      # The gate redacts both keys from every log and recorded response it writes.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sdk-gate-${{ inputs.sdk }}
          path: ${{ runner.temp }}/gate
          if-no-files-found: ignore

      - name: stop the daemon and the front
        if: always()
        run: |
          for name in socat serve daemon; do
            pid=$(cat "$RUNNER_TEMP/front/$name.pid" 2>/dev/null) || continue
            sudo kill "$pid"
          done

  typescript:
    name: typescript
    needs: sdk-gate
    if: inputs.sdk == 'typescript' || inputs.sdk == 'both'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json

      - name: check
        run: make sdk-ts-check

      - name: pack
        working-directory: sdks/typescript
        run: |
          echo "VERSION=$(node -p 'require("./package.json").version')" >>"$GITHUB_ENV"
          mkdir "$RUNNER_TEMP/sdk"
          npm pack --pack-destination "$RUNNER_TEMP/sdk"

      # A published GitHub release is the record of its version's files, so the registries get those bytes.
      - name: take the files of a published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: sdk-typescript-v${{ env.VERSION }}
        run: |
          if ! gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" >/dev/null 2>"$RUNNER_TEMP/err"; then
            grep -q 'HTTP 404' "$RUNNER_TEMP/err" || { cat "$RUNNER_TEMP/err"; exit 1; }
            echo "no release holds $TAG, so this build ships"
            exit 0
          fi
          rm -r "$RUNNER_TEMP/sdk"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/sdk"
          cd "$RUNNER_TEMP/sdk"
          sha256sum -c SHA256SUMS
          rm SHA256SUMS
          echo "the release $TAG holds the files that ship"

      - name: the tarball names the package version
        working-directory: ${{ runner.temp }}/sdk
        run: |
          [ "$(ls)" = "useshards-$VERSION.tgz" ] || { echo "expected only useshards-$VERSION.tgz, found: $(ls)"; exit 1; }
          packed=$(tar -xOzf "useshards-$VERSION.tgz" package/package.json | jq -er .version)
          [ "$packed" = "$VERSION" ] || { echo "the tarball says $packed, but the package says $VERSION"; exit 1; }

      # A clean project proves the tarball installs and imports with only the dependencies it declares.
      - name: install the tarball into a clean project
        run: |
          mkdir "$RUNNER_TEMP/clean"
          cd "$RUNNER_TEMP/clean"
          npm init -y
          npm install --no-audit --no-fund "$RUNNER_TEMP/sdk/useshards-$VERSION.tgz"
          imported=$(node --input-type=module -e 'import { version } from "useshards"; console.log(version)')
          [ "$imported" = "$VERSION" ] || { echo "the installed package says $imported, not $VERSION"; exit 1; }

      - name: sums
        working-directory: ${{ runner.temp }}/sdk
        run: sha256sum -- * >SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: sdk-typescript
          path: ${{ runner.temp }}/sdk
          if-no-files-found: error

  python:
    name: python
    needs: sdk-gate
    if: inputs.sdk == 'python' || inputs.sdk == 'both'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: check
        run: make sdk-py-check

      - name: build
        working-directory: sdks/python
        run: |
          echo "VERSION=$(uv run --locked python -c 'import useshards; print(useshards.__version__)')" >>"$GITHUB_ENV"
          uv build --out-dir "$RUNNER_TEMP/sdk"

      # A published GitHub release is the record of its version's files, so the registries get those bytes.
      - name: take the files of a published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: sdk-python-v${{ env.VERSION }}
        run: |
          if ! gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" >/dev/null 2>"$RUNNER_TEMP/err"; then
            grep -q 'HTTP 404' "$RUNNER_TEMP/err" || { cat "$RUNNER_TEMP/err"; exit 1; }
            echo "no release holds $TAG, so this build ships"
            exit 0
          fi
          rm -r "$RUNNER_TEMP/sdk"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/sdk"
          cd "$RUNNER_TEMP/sdk"
          sha256sum -c SHA256SUMS
          rm SHA256SUMS
          echo "the release $TAG holds the files that ship"

      - name: the wheel and the sdist name the package version
        working-directory: ${{ runner.temp }}/sdk
        run: |
          want=$(printf '%s\n' "useshards-$VERSION-py3-none-any.whl" "useshards-$VERSION.tar.gz" | sort)
          [ "$(ls | sort)" = "$want" ] || { echo "expected $want, found: $(ls)"; exit 1; }
          sdist=$(tar -xOzf "useshards-$VERSION.tar.gz" "useshards-$VERSION/PKG-INFO" | sed -n 's/^Version: //p')
          [ "$sdist" = "$VERSION" ] || { echo "the sdist says $sdist, but the package says $VERSION"; exit 1; }

      # The wheel must install and import with only its declared dependencies.
      - name: install the wheel into a clean venv
        run: |
          uv venv "$RUNNER_TEMP/clean"
          uv pip install --python "$RUNNER_TEMP/clean" "$RUNNER_TEMP/sdk/useshards-$VERSION-py3-none-any.whl"
          imported=$("$RUNNER_TEMP/clean/bin/python" -c 'import useshards; print(useshards.__version__)')
          [ "$imported" = "$VERSION" ] || { echo "the installed package says $imported, not $VERSION"; exit 1; }

      - name: sums
        working-directory: ${{ runner.temp }}/sdk
        run: sha256sum -- * >SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: sdk-python
          path: ${{ runner.temp }}/sdk
          if-no-files-found: error
