name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: v2.12.2
  GOVULNCHECK_VERSION: v1.1.4
  UV_VERSION: 0.5.9

jobs:
  # No e2e here: that needs a Linux box with runsc (SHARD-9).
  build:
    name: build / vet / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      # A file behind the integration tag exists only under it, so the plain vet never sees one break.
      - name: vet the integration tests
        run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go vet -tags integration ./...

      # A firecracker snapshot shares blocks or is refused, and the runner's ext4 shares none: the tests get an xfs root.
      - name: reflink root for the snapshot tests
        run: |
          command -v mkfs.xfs >/dev/null || (sudo apt-get update -q && sudo apt-get install -y -q xfsprogs)
          truncate -s 4G /tmp/reflink.img
          mkfs.xfs -q -m reflink=1 /tmp/reflink.img
          sudo mkdir -p /mnt/reflink
          sudo mount -o loop /tmp/reflink.img /mnt/reflink
          sudo chown "$(id -u):$(id -g)" /mnt/reflink
          echo "TMPDIR=/mnt/reflink" >> "$GITHUB_ENV"

      - name: test
        run: go test ./...

      - name: cross-compile linux/amd64
        run: GOOS=linux GOARCH=amd64 go build ./...

  # The Mac build: cgo over Virtualization.framework never cross-compiles from Linux, so the darwin
  # binaries build and unit-test here. The runner is a VM with no nested virtualization, so every
  # test that boots a VM skips; those run by hand before a release (docs/release.md).
  darwin:
    name: darwin build / vet / test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build arm64
        run: make build-darwin

      - name: vet
        run: CGO_ENABLED=1 go vet ./...

      - name: test
        run: CGO_ENABLED=1 go test ./...

      - name: build amd64
        run: make build-darwin DARWIN_ARCH=amd64

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

      # Formatting lives in golangci-lint too, so gofmt and goimports have one
      # source of truth. --diff exits non-zero when anything needs reformatting.
      - name: format check
        run: golangci-lint fmt --diff

  # useshards, the TypeScript SDK: unit tests over a fake daemon, so no box and no daemon.
  sdk-typescript:
    name: typescript sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json

      - name: check
        run: make sdk-ts-check

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }} ./...

  # Unit tests on the oldest and the newest Python the SDK supports; the shared suite needs a daemon.
  python-sdk:
    name: python sdk (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}

      - name: generated code is in step with its source
        run: |
          make sdk-py
          if [ -n "$(git status --porcelain -- sdks/python)" ]; then
            git status --short -- sdks/python
            git diff -- sdks/python
            exit 1
          fi

      - name: check
        run: make sdk-py-check

  # An SDK change carries its release note, and only the Release SDKs branch edits a version.
  sdk-changeset:
    name: sdk changeset
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"

      - name: release tooling tests
        run: make sdk-release-test

      # A fork may name its branch changeset-release/main, so it never counts as the release branch.
      - name: changeset check
        env:
          BASE: ${{ github.base_ref || 'main' }}
          BRANCH: ${{ github.event.pull_request.head.repo.full_name != github.repository && github.event_name == 'pull_request' && 'fork' || github.head_ref || github.ref_name }}
        run: python3 sdks/release/release.py check --base "origin/$BASE" --branch "$BRANCH"

  # The SDK release gate (SHARD-493): both packages against one real daemon, the runc provider as root, behind a TLS front.
  sdk-gate:
    name: sdk release gate
    runs-on: ubuntu-latest
    env:
      SHARD_REMOTE: https://127.0.0.1:8443
      SHARD_GATE_HOST_PATHS: /mnt/reflink
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"

      - name: host tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xfsprogs socat nftables
          command -v runc >/dev/null || sudo apt-get install -y -q runc

      - name: build
        run: make build build-shard-init

      # The daemon refuses a root that cannot reflink, and the runner's ext4 cannot.
      - name: daemon, front and tokens
        run: |
          set -o pipefail
          dir="$RUNNER_TEMP/front"
          root=/mnt/reflink/shard
          mkdir -p "$dir"
          truncate -s 8G "$RUNNER_TEMP/reflink.img"
          mkfs.xfs -q -m reflink=1 "$RUNNER_TEMP/reflink.img"
          sudo mkdir -p /mnt/reflink
          sudo mount -o loop "$RUNNER_TEMP/reflink.img" /mnt/reflink

          # One token with every public scope, and a "*" one the gate proves still reaches no local route.
          api=$(sudo bin/shard --root "$root" tokens mint --name gate --scopes 'sandbox:read,sandbox:write,sandbox:delete,exec,secret:*,policy:*' | jq -r .token)
          echo "::add-mask::$api"
          wildcard=$(sudo bin/shard --root "$root" tokens mint --name gate-wildcard --scopes '*' | jq -r .token)
          echo "::add-mask::$wildcard"
          { echo "SHARD_API_KEY=$api"; echo "SHARD_SUITE_WILDCARD_KEY=$wildcard"; } >>"$GITHUB_ENV"

          sudo SHARD_INIT_PATH="$PWD/bin/shard-init" bin/shard --root "$root" daemon --provider runc >"$dir/daemon.log" 2>&1 &
          echo $! >"$dir/daemon.pid"
          timeout 60 sh -c "until grep -q 'api listening on' '$dir/daemon.log' && grep -q 'proxy listening on' '$dir/daemon.log'; do sleep 0.2; done" || { cat "$dir/daemon.log"; exit 1; }

          sudo bin/shard --root "$root" serve --listen 127.0.0.1:2377 >"$dir/serve.log" 2>&1 &
          echo $! >"$dir/serve.pid"
          timeout 30 sh -c "until grep -q 'serve listening on' '$dir/serve.log'; do sleep 0.2; done" || { cat "$dir/serve.log"; exit 1; }

          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -days 1 -subj /CN=127.0.0.1 \
            -addext subjectAltName=IP:127.0.0.1 -keyout "$dir/key.pem" -out "$dir/cert.pem" 2>/dev/null
          socat "OPENSSL-LISTEN:8443,bind=127.0.0.1,reuseaddr,fork,cert=$dir/cert.pem,key=$dir/key.pem,verify=0" TCP:127.0.0.1:2377 &
          echo $! >"$dir/socat.pid"
          echo "SHARD_CA_FILE=$dir/cert.pem" >>"$GITHUB_ENV"
          # The front refuses a request with no token, so any answer at all proves the TLS front is up.
          timeout 30 sh -c 'until curl -sS --cacert "$0" -o /dev/null https://127.0.0.1:8443/v0/version; do sleep 0.2; done' "$dir/cert.pem"

      - name: gate
        run: make sdk-gate SDK_GATE_FLAGS="--out $RUNNER_TEMP/gate"

      - name: daemon and front logs
        if: failure()
        run: cat "$RUNNER_TEMP/front/daemon.log" "$RUNNER_TEMP/front/serve.log"

      # The gate redacts both keys from every log and recorded response it writes.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sdk-gate
          path: ${{ runner.temp }}/gate
          if-no-files-found: ignore

      - name: stop the daemon and the front
        if: always()
        run: |
          for name in socat serve daemon; do
            pid=$(cat "$RUNNER_TEMP/front/$name.pid" 2>/dev/null) || continue
            sudo kill "$pid"
          done
