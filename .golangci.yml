version: "2"

run:
  timeout: 5m
  # Without this the integration files are invisible to the linter: the tag is the whole mechanism.
  build-tags:
    - integration

linters:
  # Enable explicitly rather than curating a default set, so the list here is the
  # whole truth about what runs.
  default: none
  enable:
    - bodyclose      # unclosed HTTP response bodies (we will drive the Firecracker API over HTTP)
    - copyloopvar    # stale loop-variable captures
    - depguard       # the layout boundaries in AGENTS.md; see settings below
    - errcheck       # unchecked errors
    - errorlint      # error comparison and wrapping mistakes
    - govet          # the standard vet suite
    - gosec          # security rules; shard runs as root and shells out to runsc
    - ineffassign    # assignments that are never read
    - misspell       # typos in comments and strings
    - modernize      # suggest modern stdlib and language features
    - revive         # style and naming
    - staticcheck    # correctness and simplification
    - unused         # dead code
    - usetesting     # prefer t.TempDir, t.Setenv and friends over manual equivalents

  settings:
    depguard:
      rules:
        # pkg/ holds thin drivers over external things. The moment one needs a
        # domain type it stops being a driver, so this is the whole boundary.
        pkg-knows-no-domain:
          files:
            - "**/pkg/**"
          deny:
            - pkg: github.com/presmihaylov/shard/models
              desc: "pkg/ must not import models/. If it needs a domain type, it belongs in services/."
            - pkg: github.com/presmihaylov/shard/services
              desc: "pkg/ must not import services/. Dependencies point services -> pkg, never back."
        # cli/ is a thin client of the daemon: it holds no layer and reaches every
        # verb over the socket. The allow list is the whole of what a verb may name.
        cli-speaks-only-to-the-daemon:
          files:
            - "**/cli/*.go"
            - "!**/cli/*_test.go"
          allow:
            - $gostd
            - github.com/presmihaylov/shard/models
            - github.com/presmihaylov/shard/pkg/pty
            - github.com/presmihaylov/shard/services/client
            - github.com/presmihaylov/shard/services/sandbox
            - github.com/presmihaylov/shard/services/daemon
            - github.com/presmihaylov/shard/services/serve
        # models/ is a leaf so that it never participates in an import cycle.
        models-is-a-leaf:
          files:
            - "**/models/**"
          deny:
            - pkg: github.com/presmihaylov/shard/pkg
              desc: "models/ is a leaf: domain structs only, no I/O and no drivers."
            - pkg: github.com/presmihaylov/shard/services
              desc: "models/ is a leaf: domain structs only, no business logic."
            - pkg: github.com/presmihaylov/shard/cli
              desc: "models/ is a leaf: domain structs only, no command wiring."
    errcheck:
      check-type-assertions: true
    gosec:
      excludes:
        # We deliberately exec external binaries (runsc, firecracker) with paths
        # built from config. G204 fires on every one of those calls, and G702 on
        # the shard-init ForkExec, whose whole job is to run the image entrypoint.
        - G204
        - G702
        # shard is a root-run file manager: it opens, writes and renames paths it
        # builds itself, from a root it owns. G304 and G703 fire on every one.
        - G304
        - G703
    revive:
      rules:
        - name: exported
          # Only demand doc comments once a package is actually exported for reuse.
          disabled: true
        - name: unused-parameter
          disabled: true

  exclusions:
    presets:
      - std-error-handling
    rules:
      # Tests may ignore errors and use weak randomness without it meaning anything.
      - path: _test\.go
        linters:
          - errcheck
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/presmihaylov/shard
